<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entre a Fortuna e o Poder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
    }

    #viewer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 64px;
      background: #fdfcf7;
    }

    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      z-index: 10;
      gap: 6px;
    }

    button {
      background: #3a3a3a;
      color: #f0f0f0;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      white-space: nowrap;
    }

    button:active { background: #555; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #progresso {
      color: #aaa;
      font-size: 12px;
      flex: 1;
      text-align: center;
      min-width: 40px;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #f0f0f0;
      font-size: 16px;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }

    #loading.hidden { display: none; }

    /* Notificação "Posição salva" */
    #toast {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      background: rgba(40, 40, 40, 0.95);
      color: #f0f0f0;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 30;
      transition: transform 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.visible {
      transform: translateX(-50%) translateY(0);
    }

    /* Botão de marcador com destaque quando ativo */
    #btnMarcador.ativo {
      background: #c9a227;
      color: #1a1a1a;
    }
  </style>
</head>
<body>

  <div id="viewer"></div>

  <div id="controls">
    <button id="btnInicio" title="Voltar ao início">⏮</button>
    <button id="btnAnterior" disabled>‹</button>
    <div id="progresso">—</div>
    <button id="btnMarcador" title="Salvar marcador">🔖</button>
    <button id="btnProxima">›</button>
  </div>

  <div id="toast"></div>
  <div id="loading">Carregando o livro…</div>

  <script>
    // ============================================================
    // CONFIGURAÇÃO
    // ============================================================
    const LIVRO_EPUB = "livro.epub";

    // Chaves usadas no localStorage
    const CHAVE_POSICAO = "livro_posicao_atual";   // posição salva automaticamente
    const CHAVE_MARCADOR = "livro_marcador_manual"; // marcador explícito do usuário

    // ============================================================
    // ELEMENTOS
    // ============================================================
    const viewerEl     = document.getElementById("viewer");
    const btnInicio    = document.getElementById("btnInicio");
    const btnAnterior  = document.getElementById("btnAnterior");
    const btnProxima   = document.getElementById("btnProxima");
    const btnMarcador  = document.getElementById("btnMarcador");
    const progressoEl  = document.getElementById("progresso");
    const loadingEl    = document.getElementById("loading");
    const toastEl      = document.getElementById("toast");

    // ============================================================
    // INICIALIZAÇÃO DO EPUB
    // ============================================================
    const book = ePub(LIVRO_EPUB);
    const rendition = book.renderTo("viewer", {
      width: "100%",
      height: "100%",
      flow: "paginated",
      spread: "none",
      manager: "default"
    });

    // Tenta recuperar posição salva anteriormente.
    // Preferência: marcador manual > posição automática > início.
    let cfiInicial = null;
    try {
      cfiInicial =
        localStorage.getItem(CHAVE_MARCADOR) ||
        localStorage.getItem(CHAVE_POSICAO);
    } catch (e) {
      console.warn("localStorage indisponível:", e);
    }

    rendition.display(cfiInicial || undefined)
      .then(() => {
        loadingEl.classList.add("hidden");
        if (cfiInicial) {
          mostrarToast("Retomando de onde você parou");
        }
        atualizarEstadoMarcador();
      })
      .catch(err => {
        // Se o CFI salvo estiver corrompido, tenta abrir do início
        console.warn("Falha ao restaurar posição, abrindo do início:", err);
        if (cfiInicial) {
          localStorage.removeItem(CHAVE_POSICAO);
          localStorage.removeItem(CHAVE_MARCADOR);
          rendition.display();
        } else {
          loadingEl.textContent = "Erro ao carregar o livro: " + err.message;
        }
      });

    // ============================================================
    // NAVEGAÇÃO
    // ============================================================
    function irParaProxima() { rendition.next(); }
    function irParaAnterior() { rendition.prev(); }

    btnProxima.addEventListener("click", irParaProxima);
    btnAnterior.addEventListener("click", irParaAnterior);

    // Swipe no celular
    let touchStartX = 0;
    viewerEl.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    viewerEl.addEventListener("touchend", e => {
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(deltaX) > 50) {
        if (deltaX < 0) irParaProxima();
        else irParaAnterior();
      }
    }, { passive: true });

    // Teclado (útil para testar no desktop)
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") irParaProxima();
      if (e.key === "ArrowLeft") irParaAnterior();
    });

    // ============================================================
    // SALVAMENTO AUTOMÁTICO DE POSIÇÃO
    // Sempre que a página muda, salva o CFI no localStorage.
    // ============================================================
    let debounceTimer = null;

    rendition.on("relocated", (location) => {
      const pct = location.start.percentage;
      progressoEl.textContent = Math.round(pct * 100) + "%";

      btnAnterior.disabled = (location.start.index === 0);
      btnProxima.disabled = (pct >= 0.999);

      // Salva a posição (com debounce para não escrever a cada micro-movimento)
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        try {
          localStorage.setItem(CHAVE_POSICAO, location.start.cfi);
        } catch (e) { /* silencioso */ }
      }, 300);
    });

    // Ao fechar a aba, garante o último salvamento
    window.addEventListener("beforeunload", () => {
      const loc = rendition.currentLocation();
      if (loc && loc.start && loc.start.cfi) {
        try {
          localStorage.setItem(CHAVE_POSICAO, loc.start.cfi);
        } catch (e) {}
      }
    });

    // ============================================================
    // BOTÃO "MARCADOR" MANUAL
    // Salva um ponto explícito, separado da posição automática.
    // ============================================================
    btnMarcador.addEventListener("click", () => {
      const loc = rendition.currentLocation();
      if (!loc || !loc.start || !loc.start.cfi) return;

      try {
        localStorage.setItem(CHAVE_MARCADOR, loc.start.cfi);
        mostrarToast("🔖 Marcador salvo nesta página");
        atualizarEstadoMarcador();
      } catch (e) {
        mostrarToast("Não foi possível salvar o marcador");
      }
    });

    function atualizarEstadoMarcador() {
      // Destaca o botão se o marcador salvo coincide com a posição atual
      let marcador = null;
      try { marcador = localStorage.getItem(CHAVE_MARCADOR); } catch (e) {}
      const loc = rendition.currentLocation();
      const cfiAtual = loc && loc.start ? loc.start.cfi : null;
      btnMarcador.classList.toggle("ativo", !!(marcador && cfiAtual && marcador === cfiAtual));
    }

    rendition.on("relocated", atualizarEstadoMarcador);

    // ============================================================
    // BOTÃO "INÍCIO" (recomeçar do zero)
    // ============================================================
    btnInicio.addEventListener("click", () => {
      if (!confirm("Voltar ao início do livro? Isso apagará a posição e o marcador salvos.")) return;
      try {
        localStorage.removeItem(CHAVE_POSICAO);
        localStorage.removeItem(CHAVE_MARCADOR);
      } catch (e) {}
      rendition.display();
      mostrarToast("Voltando ao início");
      atualizarEstadoMarcador();
    });

    // ============================================================
    // TOAST (notificação temporária)
    // ============================================================
    let toastTimer = null;
    function mostrarToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("visible");
      }, 2200);
    }

    // ============================================================
    // RESPONSIVIDADE
    // ============================================================
    window.addEventListener("resize", () => {
      rendition.resize();
    });
  </script>
</body>
</html>
