<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entre a Fortuna e o Poder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
    }

    /* Área de leitura ocupa toda a tela, menos a barra de botões */
    #viewer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 64px; /* altura da barra de botões */
      background: #fdfcf7;
    }

    /* Barra de botões fixa na parte inferior */
    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      z-index: 10;
    }

    button {
      background: #3a3a3a;
      color: #f0f0f0;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button:active { background: #555; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Indicador de progresso no centro */
    #progresso {
      color: #aaa;
      font-size: 13px;
      flex: 1;
      text-align: center;
    }

    /* Tela de carregamento */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #f0f0f0;
      font-size: 16px;
      z-index: 20;
    }

    #loading.hidden { display: none; }
  </style>
</head>
<body>

  <div id="viewer"></div>

  <div id="controls">
    <button id="btnAnterior" disabled>‹ Anterior</button>
    <div id="progresso">Carregando…</div>
    <button id="btnProxima">Próxima ›</button>
  </div>

  <div id="loading">Carregando o livro…</div>

  <script>
    // === CONFIGURAÇÃO ===
    // Ajuste aqui o caminho/nome do seu EPUB
    const LIVRO_EPUB = "livro.epub";

    // === INICIALIZAÇÃO ===
    const viewerEl = document.getElementById("viewer");
    const btnAnterior = document.getElementById("btnAnterior");
    const btnProxima = document.getElementById("btnProxima");
    const progressoEl = document.getElementById("progresso");
    const loadingEl = document.getElementById("loading");

    const book = ePub(LIVRO_EPUB);
    const rendition = book.renderTo("viewer", {
      width: "100%",
      height: "100%",
      flow: "paginated",       // força paginação em colunas
      spread: "none",          // uma página por vez (ideal para celular)
      manager: "default"
    });

    // Mostra a tela de carregamento até o livro abrir
    rendition.display().then(() => {
      loadingEl.classList.add("hidden");
      atualizarBotoes();
    }).catch(err => {
      loadingEl.textContent = "Erro ao carregar o livro: " + err.message;
      console.error(err);
    });

    // === NAVEGAÇÃO ===
    function irParaProxima() {
      rendition.next();
    }
    function irParaAnterior() {
      rendition.prev();
    }

    btnProxima.addEventListener("click", irParaProxima);
    btnAnterior.addEventListener("click", irParaAnterior);

    // Também permite passar página com swipe (arrastar o dedo)
    let touchStartX = 0;
    viewerEl.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    viewerEl.addEventListener("touchend", e => {
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(deltaX) > 50) {
        if (deltaX < 0) irParaProxima();
        else irParaAnterior();
      }
    }, { passive: true });

    // === ATUALIZA ESTADO DOS BOTÕES E PROGRESSO ===
    function atualizarBotoes() {
      // epub.js não expõe diretamente "tem próxima?" de forma simples,
      // então calculamos a partir da localização atual vs total.
      const loc = rendition.currentLocation();
      if (loc && loc.start) {
        const porcentagem = Math.round(loc.start.percentage * 100);
        progressoEl.textContent = porcentagem + "%";
      }
    }

    // Atualiza sempre que a página mudar (seja por botão ou swipe)
    rendition.on("relocated", (location) => {
      const pct = location.start.percentage;
      progressoEl.textContent = Math.round(pct * 100) + "%";

      // Desabilita botão de voltar se estiver no início
      btnAnterior.disabled = (location.start.index === 0);
      // Desabilita próximo se estiver no fim
      btnProxima.disabled = (pct >= 0.999);
    });

    // === NAVEGAÇÃO POR TECLADO (útil para testar no desktop) ===
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") irParaProxima();
      if (e.key === "ArrowLeft") irParaAnterior();
    });

    // Ao girar o celular / redimensionar, epub.js recalcula a paginação
    window.addEventListener("resize", () => {
      rendition.resize();
    });
  </script>
</body>
</html>
